openapi: 3.1.1
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: 대기열 기반 수강신청 시스템 API
  version: 0.1.0
  summary: 웹 프런트엔드용 HTTP 계약 설계 초안(구현 준비용, 미배포)
  description: |
    대기열 기반 수강신청 시스템의 웹 프런트엔드가 호출하는 HTTP 계약 **설계 초안**이다. 스키마·상태 코드·헤더·인증·예시를
    구현에 바로 쓸 수 있는 수준으로 정의하지만 서버·웹 애플리케이션 코드, 실제 배포, 성능 검증 결과를 뜻하지 않는다.

    - 정책 합의일: 2026-11-10. 회의 요구와 업무 정의의 출처는 [단위업무기술서](단위업무기술서.md),
      [업무기능도](업무기능도.md), [업무흐름도](업무흐름도.md), [ERD](ERD.md)이다.
    - 출처는 행 번호가 아니라 업무 ID와 문서 앵커로 표기한다. 각 연산의 `x-business-functions`는 단위업무 ID와
      단위업무기술서 앵커(`단위업무기술서.md#aut-01-01` 형식)를 가리킨다.
    - 수치(동시 처리 수 N 기본 100·범위 1~1,000, 폴링 2초, 페이지 20건, Access 15분, 세션 7일, 로그인 자격 증명
      컨텍스트 5분, 익명 소유 증명 10분)는 합의된 초안 정책이며 측정값이 아니다.

    ## 1. 범위와 제외 사항

    - 클라이언트가 호출하는 **20개 연산(17개 경로)**만 정의한다. 대기열 추출·처리·복구(QUE-02-01~03)는 서버 내부
      처리이며 HTTP 연산이 없다.
    - 제외: 회원가입·비밀번호 변경/찾기, 중복 로그인 제어, 전 기기 로그아웃, 장바구니, 시간표·학점·신청 기간,
      다학기·분반, 과목 물리 삭제(`DELETE`)·과목코드 재사용, 폐강 되돌리기·자동/강제 폐강, 관리자 수강 취소,
      학생 검색·수강생 명단, 티켓 목록·취소, 대기 포기, 관리자 우선 대기열, 좌석 대기명단, 알림, 강의계획서 관리,
      설정 이력, 부분 수정(`PATCH`), 별도 현재 사용자·입장 상태 조회, 요청 수 제한(429).
    - 과목 삭제는 **폐강**으로 대체되었다. 폐강한 과목과 그 수강신청 행은 보존된다. 결과 코드 E12(삭제 불가)는
      폐지되었으며 어떤 응답에도 나오지 않는다.

    ## 2. 업무 기능과 HTTP 연산

