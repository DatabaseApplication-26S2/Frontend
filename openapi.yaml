        '401':
          $ref: '#/components/responses/AccessUnauthorized'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    accessBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access JWT. `Authorization: Bearer <token>`으로 보낸다. 최대 15분이며 세션 만료를 넘지 않는다. 프런트엔드 JS
        메모리에만 둔다. 필수 클레임 `sub`, `sid`, `role`, `iss`, `aud`, `iat`, `exp`. 서버는 서명·발급자·대상·시간을 검증한
        뒤 서버 세션(ACTIVE·만료 전)·사용자·역할을 권위로 확인한다. 역할·소유권·입장 검사(AUT-03-01)는 연산마다 서버가
        수행한다.
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-crs_refresh
      description: |
        불투명 난수 Refresh 토큰. `Secure; HttpOnly; SameSite=Lax; Path=/`, Domain 없음. 서버는 해시만 보존하고 사용할 때마다
        회전한다. `Max-Age`는 세션 절대 만료(로그인 후 7일, 비연장)를 넘지 않는다. 이 쿠키를 쓰는 요청은 Origin 정확 일치와
        `X-CSRF-Protection: 1`이 필요하다.
    loginProofCookie:
      type: apiKey
      in: cookie
      name: __Host-crs_login
      description: |
        로그인 접수 때 발급하는 익명 소유 증명. 600초 동안 유효하며 원래 익명 컨텍스트의 LOGIN 티켓 조회와 최초 토큰 수령에만
        쓴다. 서버는 검증용 다이제스트만 보존한다. 인증 세션이나 Access로 대체하지 않는다.
  parameters:
    TicketIdPath:
      name: ticketId
      in: path
      required: true
      description: 티켓 번호(양의 10진수 문자열). 형식 위반은 400 E09다.
      schema:
        $ref: '#/components/schemas/TicketId'
    CourseCodePath:
      name: courseCode
      in: path
      required: true
      description: 과목코드(ASCII 영문자·숫자 1~10자, 대소문자 구분). 형식 위반은 400 E09다.
      schema:
        $ref: '#/components/schemas/CourseCode'
    PageQuery:
      name: page
      in: query
      required: false
      description: 페이지 번호(1부터). 페이지 크기는 20 고정이다. 1 미만·정수 아님은 400 E09다.
      schema:
        type: integer
        minimum: 1
        default: 1
    CategoryQuery:
      name: category
      in: query
      required: false
      description: 이수구분 필터. 생략하면 ALL이다.
      schema:
        $ref: '#/components/schemas/CourseCategoryFilter'
    SearchQuery:
      name: q
      in: query
      required: false
      description: |
        검색어. 과목명·과목코드·담당교수 이름 중 하나라도 `q`를 부분 문자열로 포함하면 일치한다(OR).
        - 리터럴 비교다. 와일드카드·정규식으로 해석하지 않으며 `%`, `_`도 글자 그대로 찾는다.
        - ASCII 영문자 A–Z만 대소문자를 구분하지 않는다. 그 밖의 문자는 그대로 비교하며 공백 trim·유니코드 정규화는 하지 않는다.
        - 생략하거나 빈 문자열이면 검색어 조건을 적용하지 않는다.
      schema:
        type: string
    OriginHeader:
      name: Origin
      in: header
      required: true
      description: |
        브라우저가 자동으로 넣는 요청 출처. 설정된 프런트엔드 출처(예: `https://app.example.com`)와 정확히 같아야 한다. 없거나
        다르면 400이 아니라 403 E02 `CSRF_CHECK_FAILED`이며 상태를 바꾸지 않는다.
      schema:
        type: string
        format: uri
      example: https://app.example.com
    CsrfProtectionHeader:
      name: X-CSRF-Protection
      in: header
      required: true
      description: |
        CSRF 방어용 사용자 정의 헤더. 값은 `1`이다. 인증 비밀이 아니라 교차 출처 단순 요청을 사전 요청으로 바꾸기 위한
        장치다. 없거나 값이 다르면 400이 아니라 403 E02 `CSRF_CHECK_FAILED`이며 상태를 바꾸지 않는다.
      schema:
        type: string
        const: '1'
      example: '1'
  headers:
    CacheControlNoStore:
      description: 사용자별·자격 증명 관련 응답의 캐시 금지.
      required: true
      schema:
        type: string
        const: no-store
    TicketLocation:
      description: 새 티켓의 상태 조회 경로. 본문의 `statusUrl`과 같다.
      required: true
      schema:
        type: string
        format: uri-reference
      example: /api/v1/tickets/1001
    CourseLocation:
      description: 등록된 과목의 조회 경로(`GET /courses/{courseCode}`).
      required: true
      schema:
        type: string
        format: uri-reference
      example: /api/v1/courses/CSE4510
    RetryAfter:
      description: 권장 폴링 간격(초). 이 초안의 값은 2다.
      required: true
      schema:
        type: integer
        minimum: 1
      example: 2
    SetLoginProofCookie:
      description: |
        익명 소유 증명 쿠키 발급. `__Host-crs_login=<불투명 값>; Max-Age=600; Path=/; Secure; HttpOnly; SameSite=Lax`.
        Domain 속성은 없다. 값은 응답 본문·로그에 나타나지 않는다.
      required: true
      schema:
        type: string
      example: '__Host-crs_login=example-login-proof; Max-Age=600; Path=/; Secure; HttpOnly; SameSite=Lax'
    SetRefreshCookie:
      description: |
        Refresh 쿠키 발급·회전. `__Host-crs_refresh=<불투명 값>; Max-Age=<초>; Path=/; Secure; HttpOnly; SameSite=Lax`.
        `Max-Age`는 세션 `expiresAt`까지 남은 초(내림)이며 넘지 않는다. Domain 속성은 없다.
      required: true
      schema:
        type: string
      example: '__Host-crs_refresh=example-opaque-refresh; Max-Age=604799; Path=/; Secure; HttpOnly; SameSite=Lax'
    ClearRefreshCookie:
      description: 사용할 수 없는 Refresh 쿠키 삭제.
      required: true
      schema:
        type: string
      example: '__Host-crs_refresh=; Max-Age=0; Path=/; Secure; HttpOnly; SameSite=Lax'
    ClearAuthCookies:
      description: |
        `Set-Cookie` 헤더 두 개로 `__Host-crs_refresh`와 `__Host-crs_login`을 모두 삭제한다. 각각
        `<이름>=; Max-Age=0; Path=/; Secure; HttpOnly; SameSite=Lax` 형식이다.
      required: true
      schema:
        type: string
      example: '__Host-crs_refresh=; Max-Age=0; Path=/; Secure; HttpOnly; SameSite=Lax'
    WwwAuthenticateBearer:
      description: Bearer 인증 실패 안내(RFC 6750). Access가 없으면 `Bearer`, 무효·만료면 `error="invalid_token"`을 붙인다.
      required: true
      schema:
        type: string
      example: Bearer error="invalid_token"
  responses:
    AccessUnauthorized:
      description: |
        Access 인증 실패(401 E02). Access가 없거나 형식·서명·발급자·대상이 맞지 않으면 `reason`이 없고, 만료면
        `ACCESS_TOKEN_EXPIRED`, 세션이 폐기·만료되었으면 `SESSION_REVOKED`·`SESSION_EXPIRED`다.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticateBearer'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            accessMissing:
              $ref: '#/components/examples/ProblemE02AccessMissing'
            accessExpired:
              $ref: '#/components/examples/ProblemE02AccessExpired'
            sessionRevoked:
              $ref: '#/components/examples/ProblemE02SessionRevoked'
            sessionExpired:
              $ref: '#/components/examples/ProblemE02SessionExpired'
    RoleForbidden:
      description: 역할이 이 연산을 허용하지 않음(403 E02 `FORBIDDEN`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            forbidden:
              $ref: '#/components/examples/ProblemE02Forbidden'
    CsrfRejected:
      description: Origin 또는 `X-CSRF-Protection` 검사 실패(403 E02 `CSRF_CHECK_FAILED`). 어떤 상태도 바꾸지 않는다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            csrfFailed:
              $ref: '#/components/examples/ProblemE02CsrfFailed'
    CourseNotFound:
      description: 과목코드에 해당하는 과목 없음(404 E04).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            notFound:
              $ref: '#/components/examples/ProblemE04CourseNotFound'
    AdmissionRequired:
      description: 학생의 현재 세션이 수강신청 화면에 입장하지 않음(409 E15). `POST /admission`으로 입장한다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            admissionRequired:
              $ref: '#/components/examples/ProblemE15AdmissionRequired'
    InternalError:
      description: 기술 오류(500 `INTERNAL_ERROR`). 업무 결과 코드가 아니며 E99와 다르다. 내부 정보를 노출하지 않는다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            internalError:
              $ref: '#/components/examples/ProblemInternalError'
  schemas:
    UserId:
      type: string
      minLength: 1
      description: 사용자ID(학생은 학번). 비어 있지 않은 문자열이며 정규화 없이 정확히 비교한다.
      examples: ['20260001']
    TicketId:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: 서버가 부여한 티켓 번호(서버 접수 순번). JavaScript 정수 정밀도 문제를 피하려고 양의 10진수 문자열로 전달한다.
      examples: ['1001']
    CourseCode:
      type: string
      pattern: '^[A-Za-z0-9]{1,10}$'
      description: |
        과목코드. ASCII 영문자·숫자 1~10자이며 대소문자를 구분해 정확히 일치시킨다. 등록 후 바꿀 수 없고 폐강 과목을 포함한
        전체 과목에서 유일하며 재사용하지 않는다. 서버 내부의 불변 과목 인스턴스ID는 API에 노출하거나 입력받지 않는다.
      examples: [CSE3010]
    UserRole:
      type: string
      enum: [STUDENT, PROFESSOR, ADMIN]
      description: 사용자 역할(학생·교수·관리자). 서버 사용자 정보가 권위다.
    CourseCategory:
      type: string
      enum: [GENERAL, MAJOR]
      description: 이수구분. GENERAL은 교양, MAJOR는 전공이다.
    CourseCategoryFilter:
      type: string
      enum: [ALL, GENERAL, MAJOR]
      default: ALL
      description: 과목 검색의 이수구분 필터. ALL은 필터 없음이다.
    EvaluationType:
      type: string
      enum: [RELATIVE, ABSOLUTE, PASS_FAIL]
      description: 평가유형. RELATIVE는 상대평가, ABSOLUTE는 절대평가, PASS_FAIL은 P/F다.
    CourseStatus:
      type: string
      enum: [OPEN, CLOSED]
      description: 과목 상태. OPEN은 개설, CLOSED는 폐강이다. 폐강을 되돌리는 연산은 없다.
    EnrollmentStatus:
      type: string
      enum: [ENROLLED, CLOSED]
      description: 수강신청 행 상태. ENROLLED는 신청, CLOSED는 폐강으로 보존된 행이다. 취소는 상태가 아니라 행 삭제다.
    EnrollmentType:
      type: string
      enum: [STUDENT, ADMIN]
      description: 신청 구분. STUDENT는 학생 신청(대기열), ADMIN은 관리자 배정이다.
    TicketRequestType:
      type: string
      enum: [LOGIN, ADMISSION, ENROLLMENT, CANCELLATION]
      description: 대기열 요청 유형. 로그인·화면 진입·수강 신청·수강 취소 4가지뿐이다.
    TicketStatus:
      type: string
      enum: [RECEIVED, WAITING, PROCESSING, SUCCEEDED, REJECTED]
      description: 티켓 상태. RECEIVED·WAITING·PROCESSING은 미완료, SUCCEEDED·REJECTED는 종결이다.
    TicketReceiptStatus:
      type: string
      enum: [RECEIVED, WAITING]
      description: 접수 확정 시점의 상태 스냅샷. 이후 상태를 보장하지 않는다.
    TicketResultCode:
      type: string
      enum: [OK, E01, E02, E04, E05, E06, E07, E08, E15, E99]
      description: |
        티켓 종결 결과 코드. 유형별 허용 값은 `Ticket` 스키마 조건과 같다. E07은 여석 없음으로 끝난 종결 거절이며 좌석
        대기명단이 아니다. E99는 안전한 소유권 회수 후 재투입 한도 소진이다.
    ProblemCode:
      type: string
      enum: [E01, E02, E03, E04, E05, E06, E09, E10, E11, E13, E14, E15, INTERNAL_ERROR]
      description: HTTP 오류 응답의 코드. E07·E08·E99는 티켓 결과로만 쓰므로 포함하지 않는다.
    AuthFailureReason:
      type: string
      enum:
        - ACCESS_TOKEN_EXPIRED
        - SESSION_REVOKED
        - SESSION_EXPIRED
        - REFRESH_TOKEN_INVALID
        - REFRESH_TOKEN_REUSED
        - LOGIN_PROOF_INVALID
        - LOGIN_PROOF_EXPIRED
        - LOGIN_EXCHANGE_CONSUMED
        - CSRF_CHECK_FAILED
        - FORBIDDEN
      description: E02의 세부 사유. 앞의 5개는 401, 뒤의 5개는 403과 함께 쓴다. Access 없음·형식 오류의 401에는 사유가 없다.
    CourseClosureItemCode:
      type: string
      enum: [OK, E02, E04, E14]
      description: 일괄 폐강의 과목별 결과 코드.
    StatusUrl:
      type: string
      format: uri-reference
      pattern: '^/api/v1/tickets/[1-9][0-9]*$'
      description: 티켓 상태 조회 경로(`Location` 헤더와 같음).
      examples: [/api/v1/tickets/1001]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [userId, password]
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true
          description: |
            입력 비밀번호 원문. 접수 후 최대 5분 동안 서버 메모리의 단기 요청 컨텍스트에만 두고, 차례가 되면 ENT-01의 영구
            비밀번호 해시와 비교한 직후 폐기한다. DB·티켓·이력·로그·오류 응답에 저장하거나 되풀이하지 않는다. 정규화하지
            않는다.
    LoginTicketReceipt:
      type: object
      description: LOGIN 티켓 접수증. 자격 증명·토큰·소유 증명 값을 담지 않는다(소유 증명은 쿠키로만 전달).
      additionalProperties: false
      required: [ticketId, requestType, status, submittedAt, statusUrl, credentialExpiresAt, proofExpiresAt]
      properties:
        ticketId:
          $ref: '#/components/schemas/TicketId'
        requestType:
          $ref: '#/components/schemas/TicketRequestType'
          const: LOGIN
        status:
          $ref: '#/components/schemas/TicketReceiptStatus'
        submittedAt:
          type: string
          format: date-time
          description: 서버 접수 시각.
        statusUrl:
          $ref: '#/components/schemas/StatusUrl'
        credentialExpiresAt:
          type: string
          format: date-time
          description: 단기 자격 증명 컨텍스트 만료 시각(`submittedAt` + 5분). 그 전에 검증하지 못하면 결과는 E01이다.
        proofExpiresAt:
          type: string
          format: date-time
          description: 익명 소유 증명 만료 시각(`submittedAt` + 10분). 이후에는 조회·토큰 수령을 할 수 없다.
    TicketReceipt:
      type: object
      description: 인증 후 대기열 요청(ADMISSION·ENROLLMENT·CANCELLATION)의 접수증. 202는 업무 성공이 아니다.
      additionalProperties: false
      required: [ticketId, requestType, status, submittedAt, statusUrl]
      properties:
        ticketId:
          $ref: '#/components/schemas/TicketId'
        requestType:
          type: string
          enum: [ADMISSION, ENROLLMENT, CANCELLATION]
        status:
          $ref: '#/components/schemas/TicketReceiptStatus'
        submittedAt:
          type: string
          format: date-time
          description: 서버 접수 시각.
        statusUrl:
          $ref: '#/components/schemas/StatusUrl'
    AdmissionState:
      type: object
      description: 이미 입장한 세션의 입장 상태.
      additionalProperties: false
      required: [admittedAt]
      properties:
        admittedAt:
          type: string
          format: date-time
          description: 현재 세션의 화면 입장 시각.
    TicketResult:
      type: object
      description: 불변 종결 결과. 현재 여석·신청 목록·자격 증명을 담지 않는다.
      additionalProperties: false
      required: [code, completedAt]
      properties:
        code:
          $ref: '#/components/schemas/TicketResultCode'
        completedAt:
          type: string
          format: date-time
          description: 결과 확정 시각.
    Ticket:
      type: object
      description: 본인 티켓의 상태 보기. 처리기·리스·슬롯·세션 참조 같은 내부 값과 토큰을 담지 않는다.
      additionalProperties: false
      required: [ticketId, requestType, courseCode, submittedAt, status, queuePosition, result]
      properties:
        ticketId:
          $ref: '#/components/schemas/TicketId'
        requestType:
          $ref: '#/components/schemas/TicketRequestType'
        courseCode:
          description: ENROLLMENT·CANCELLATION의 대상 과목코드(접수 시 고정). LOGIN·ADMISSION은 null이다.
          oneOf:
            - $ref: '#/components/schemas/CourseCode'
            - type: 'null'
        submittedAt:
          type: string
          format: date-time
          description: 서버 접수 시각.
        status:
          $ref: '#/components/schemas/TicketStatus'
        queuePosition:
          type: [integer, 'null']
          minimum: 1
          description: WAITING일 때만 값이 있다. 앞선 WAITING 티켓 수 + 1인 참고 순번이며 소요 시간·완료 순서가 아니다.
        result:
          description: 종결(SUCCEEDED·REJECTED)일 때만 값이 있다. 확정 후 바뀌지 않는다.
          oneOf:
            - $ref: '#/components/schemas/TicketResult'
            - type: 'null'
      allOf:
        - if:
            properties:
              requestType:
                enum: [ENROLLMENT, CANCELLATION]
          then:
            properties:
              courseCode:
                $ref: '#/components/schemas/CourseCode'
          else:
            properties:
              courseCode:
                type: 'null'
        - if:
            properties:
              status:
                const: WAITING
          then:
            properties:
              queuePosition:
                type: integer
          else:
            properties:
              queuePosition:
                type: 'null'
        - if:
            properties:
              status:
                enum: [SUCCEEDED, REJECTED]
          then:
            properties:
              result:
                $ref: '#/components/schemas/TicketResult'
          else:
            properties:
              result:
                type: 'null'
        - if:
            properties:
              status:
                const: SUCCEEDED
          then:
            properties:
              result:
                properties:
                  code:
                    const: OK
        - if:
            properties:
              status:
                const: REJECTED
          then:
            properties:
              result:
                properties:
                  code:
                    not:
                      const: OK
        - if:
            properties:
              requestType:
                const: LOGIN
          then:
            properties:
              result:
                properties:
                  code:
                    enum: [OK, E01, E99]
        - if:
            properties:
              requestType:
                const: ADMISSION
          then:
            properties:
              result:
                properties:
                  code:
                    enum: [OK, E02, E99]
        - if:
            properties:
              requestType:
                const: ENROLLMENT
          then:
            properties:
              result:
                properties:
                  code:
                    enum: [OK, E02, E04, E05, E06, E07, E15, E99]
        - if:
            properties:
              requestType:
                const: CANCELLATION
          then:
            properties:
              result:
                properties:
                  code:
                    enum: [OK, E02, E04, E05, E08, E15, E99]
    AuthenticatedUser:
      type: object
      description: 토큰 주체 사용자. 서버 사용자 정보에서 읽는다.
      additionalProperties: false
      required: [userId, name, role]
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        name:
          type: string
          minLength: 1
          description: 사용자 이름.
        role:
          $ref: '#/components/schemas/UserRole'
    SessionState:
      type: object
      description: 토큰이 속한 서버 세션의 현재 상태. 세션ID와 내부 상태 값은 노출하지 않는다.
      additionalProperties: false
      required: [expiresAt, admittedAt]
      properties:
        expiresAt:
          type: string
          format: date-time
          description: 세션 절대 만료 시각(로그인 성공 시각 + 7일, 갱신해도 연장되지 않음).
        admittedAt:
          type: [string, 'null']
          format: date-time
          description: 이 세션의 수강신청 화면 입장 시각. 미입장 학생과 교수·관리자는 null이다.
    TokenResponse:
      type: object
      description: Access 발급 응답(최초 수령·갱신 공통). Refresh는 본문이 아니라 `Set-Cookie`로만 전달한다.
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, user, session]
      properties:
        accessToken:
          type: string
          minLength: 1
          description: Access JWT. JS 메모리에만 보관하고 웹 저장소·BroadcastChannel·로그에 넣지 않는다.
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
          maximum: 900
          description: Access 남은 유효 시간(초). 최대 900이며 세션 만료까지 남은 시간을 넘지 않는다.
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
        session:
          $ref: '#/components/schemas/SessionState'
      allOf:
        - if:
            properties:
              user:
                properties:
                  role:
                    not:
                      const: STUDENT
          then:
            properties:
              session:
                properties:
                  admittedAt:
                    type: 'null'
    Course:
      type: object
      description: |
        과목 보기. `remainingSeats` = max(`capacity` − `activeEnrollmentCount`, 0)이다. 관리자 배정으로
        `activeEnrollmentCount`가 `capacity`를 넘을 수 있다. CLOSED 과목은 계산된 여석과 무관하게 신청·취소할 수 없다.
        `enrolled`는 학생 호출에만 포함한다.
      additionalProperties: false
      required:
        - courseCode
        - name
        - category
        - professorName
        - evaluationType
        - capacity
        - minimumEnrollment
        - activeEnrollmentCount
        - remainingSeats
        - classroom
        - status
      properties:
        courseCode:
          $ref: '#/components/schemas/CourseCode'
        name:
          type: string
          minLength: 1
          description: 과목명.
        category:
          $ref: '#/components/schemas/CourseCategory'
        professorName:
          type: string
          minLength: 1
          description: 담당교수 이름.
        evaluationType:
          $ref: '#/components/schemas/EvaluationType'
        capacity:
          type: integer
          minimum: 1
          description: 정원.
        minimumEnrollment:
          type: integer
          minimum: 1
          description: 최소 수강인원(1 이상 정원 이하).
        activeEnrollmentCount:
          type: integer
          minimum: 0
          description: 현재 ENROLLED 행 수. CLOSED 과목은 0이다.
        remainingSeats:
          type: integer
          minimum: 0
          description: 참고 여석. 신청 성공을 보장하지 않는다.
        classroom:
          type: string
          minLength: 1
          description: 강의실.
        status:
          $ref: '#/components/schemas/CourseStatus'
        enrolled:
          type: boolean
          description: 학생 호출에만 포함. 호출 학생에게 이 과목의 현재 ENROLLED 행이 있으면 true다.
      allOf:
        - if:
            properties:
              status:
                const: CLOSED
          then:
            properties:
              activeEnrollmentCount:
                const: 0
    CoursePage:
      type: object
      description: 과목 검색 페이지(20건 고정, 과목코드 ASCII 오름차순).
      additionalProperties: false
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Course'
        page:
          type: integer
          minimum: 1
          description: 요청한 페이지 번호.
        pageSize:
          type: integer
          const: 20
        totalItems:
          type: integer
          minimum: 0
          description: 읽기 시점의 조건 일치 전체 건수.
        totalPages:
          type: integer
          minimum: 0
          description: ceil(totalItems / 20). 0건이면 0이다.
    CourseList:
      type: object
      description: 교수 담당 과목 전체(페이지 없음, 과목코드 ASCII 오름차순, 폐강 포함).
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Course'
    CourseCreateRequest:
      type: object
      description: 과목 등록 본문. 담당교수는 로그인한 교수로 정해지며 본문으로 받지 않는다.
      additionalProperties: false
      required: [courseCode, name, category, evaluationType, capacity, minimumEnrollment, classroom]
      properties:
        courseCode:
          $ref: '#/components/schemas/CourseCode'
        name:
          type: string
          minLength: 1
          pattern: '\S'
          description: 과목명. 공백 문자만으로 된 값은 E09다. trim하지 않고 그대로 저장한다.
        category:
          $ref: '#/components/schemas/CourseCategory'
        evaluationType:
          $ref: '#/components/schemas/EvaluationType'
        capacity:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: 정원(1 이상 2147483647 이하 정수). 범위를 벗어나면 E09다.
        minimumEnrollment:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: 최소 수강인원. 1 이상 `capacity` 이하이며 `capacity`보다 크면 E09다.
        classroom:
          type: string
          minLength: 1
          pattern: '\S'
          description: 강의실. 공백 문자만으로 된 값은 E09다. trim하지 않고 그대로 저장한다.
    CourseUpdateRequest:
      type: object
      description: 과목 수정 본문(수정 가능 6개 필드 전체 교체). 과목코드·담당교수·인원·상태 필드는 E09다.
      additionalProperties: false
      required: [name, category, evaluationType, capacity, minimumEnrollment, classroom]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '\S'
          description: 과목명. 공백 문자만으로 된 값은 E09다.
        category:
          $ref: '#/components/schemas/CourseCategory'
        evaluationType:
          $ref: '#/components/schemas/EvaluationType'
        capacity:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: 정원(1 이상 2147483647 이하 정수). 기존 값과 다르고 현재 인원보다 작으면 E11이다. 같으면 정원 초과 상태여도 E11이 아니다.
        minimumEnrollment:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: 최소 수강인원. 1 이상 이 본문의 `capacity` 이하이며 아니면 E09다.
        classroom:
          type: string
          minLength: 1
          pattern: '\S'
          description: 강의실. 공백 문자만으로 된 값은 E09다.
    CourseClosureResult:
      type: object
      description: 담당 과목 폐강 결과.
      additionalProperties: false
      required: [course, closedEnrollmentCount]
      properties:
        course:
          description: 폐강 후 과목(`status` CLOSED, `activeEnrollmentCount` 0).
          allOf:
            - $ref: '#/components/schemas/Course'
            - properties:
                status:
                  const: CLOSED
        closedEnrollmentCount:
          type: integer
          minimum: 0
          description: 이 폐강으로 ENROLLED에서 CLOSED로 바뀌어 보존된 행 수.
    EnrollmentRequest:
      type: object
      description: 수강 신청 본문. 학생ID는 Access 주체에서만 가져온다.
      additionalProperties: false
      required: [courseCode]
      properties:
        courseCode:
          $ref: '#/components/schemas/CourseCode'
    MyEnrollment:
      type: object
      description: 학생 본인의 현재 신청 과목 1건.
      additionalProperties: false
      required: [courseCode, name, category, professorName, classroom, enrollmentType, enrolledAt, status]
      properties:
        courseCode:
          $ref: '#/components/schemas/CourseCode'
        name:
          type: string
          minLength: 1
          description: 과목명.
        category:
          $ref: '#/components/schemas/CourseCategory'
        professorName:
          type: string
          minLength: 1
          description: 담당교수 이름.
        classroom:
          type: string
          minLength: 1
          description: 강의실.
        enrollmentType:
          $ref: '#/components/schemas/EnrollmentType'
        enrolledAt:
          type: string
          format: date-time
          description: 신청 시각(관리자 배정은 배정 시각).
        status:
          $ref: '#/components/schemas/EnrollmentStatus'
          const: ENROLLED
          description: 이 목록은 현재 신청(ENROLLED) 행만 담는다.
    MyEnrollmentList:
      type: object
      description: 학생 본인의 현재 신청 과목 전체(페이지 없음, 과목코드 ASCII 오름차순).
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyEnrollment'
    AdminEnrollmentRequest:
      type: object
      description: 관리자 배정 본문.
      additionalProperties: false
      required: [studentId, courseCode]
      properties:
        studentId:
          $ref: '#/components/schemas/UserId'
        courseCode:
          $ref: '#/components/schemas/CourseCode'
    AdminEnrollmentResult:
      type: object
      description: 관리자 배정 결과와 배정 직후 인원 현황.
      additionalProperties: false
      required: [studentId, courseCode, enrollmentType, status, enrolledAt, activeEnrollmentCount, capacity, overCapacity]
      properties:
        studentId:
          $ref: '#/components/schemas/UserId'
        courseCode:
          $ref: '#/components/schemas/CourseCode'
        enrollmentType:
          $ref: '#/components/schemas/EnrollmentType'
          const: ADMIN
        status:
          $ref: '#/components/schemas/EnrollmentStatus'
          const: ENROLLED
        enrolledAt:
          type: string
          format: date-time
          description: 배정 시각.
        activeEnrollmentCount:
          type: integer
          minimum: 1
          description: 배정 직후 현재 인원.
        capacity:
          type: integer
          minimum: 1
          description: 정원.
        overCapacity:
          type: boolean
          description: '`activeEnrollmentCount` > `capacity`이면 true.'
    ServiceSettings:
      type: object
      description: 서비스 설정과 조회 시점 슬롯 현황 스냅샷. 슬롯·리스 식별 정보는 노출하지 않는다.
      additionalProperties: false
      required: [concurrencyLimit, activeSlots, availableSlots, waitingCount, lastChangedBy, lastChangedAt]
      properties:
        concurrencyLimit:
          type: integer
          minimum: 1
          maximum: 1000
          description: 동시 처리 수 N(동시에 점유할 수 있는 대기열 작업 슬롯 수). 기본 100.
        activeSlots:
          type: integer
          minimum: 0
          description: 현재 점유 중인 슬롯 수. N을 낮춘 직후 배출 중에는 N보다 클 수 있다.
        availableSlots:
          type: integer
          minimum: 0
          description: max(`concurrencyLimit` − `activeSlots`, 0).
        waitingCount:
          type: integer
          minimum: 0
          description: 조회 시점의 WAITING 티켓 수.
        lastChangedBy:
          description: 마지막으로 N을 바꾼 관리자 사용자ID. 초기 시드 상태에서는 null이다.
          oneOf:
            - $ref: '#/components/schemas/UserId'
            - type: 'null'
        lastChangedAt:
          type: [string, 'null']
          format: date-time
          description: 마지막 변경 시각. `lastChangedBy`가 null이면 null이다.
      allOf:
        - if:
            properties:
              lastChangedBy:
                type: 'null'
          then:
            properties:
              lastChangedAt:
                type: 'null'
          else:
            properties:
              lastChangedAt:
                type: string
    ServiceSettingsUpdateRequest:
      type: object
      description: 서비스 설정 변경 본문. 다른 설정 항목은 없다.
      additionalProperties: false
      required: [concurrencyLimit]
      properties:
        concurrencyLimit:
          type: integer
          minimum: 1
          maximum: 1000
          description: 새 동시 처리 수 N(1~1,000 정수).
    ClosureCandidate:
      type: object
      description: 폐강 대상 과목(OPEN이고 현재 인원 < 최소 수강인원).
      additionalProperties: false
      required: [courseCode, name, professorName, activeEnrollmentCount, minimumEnrollment, capacity]
      properties:
        courseCode:
          $ref: '#/components/schemas/CourseCode'
        name:
          type: string
          minLength: 1
          description: 과목명.
        professorName:
          type: string
          minLength: 1
          description: 담당교수 이름.
        activeEnrollmentCount:
          type: integer
          minimum: 0
          description: 현재 인원.
        minimumEnrollment:
          type: integer
          minimum: 1
          description: 최소 수강인원.
        capacity:
          type: integer
          minimum: 1
          description: 정원.
    ClosureCandidatePage:
      type: object
      description: 폐강 대상 페이지(20건 고정, 과목코드 ASCII 오름차순).
      additionalProperties: false
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ClosureCandidate'
        page:
          type: integer
          minimum: 1
          description: 요청한 페이지 번호.
        pageSize:
          type: integer
          const: 20
        totalItems:
          type: integer
          minimum: 0
          description: 읽기 시점의 폐강 대상 전체 건수.
        totalPages:
          type: integer
          minimum: 0
          description: ceil(totalItems / 20). 0건이면 0이다.
    CourseClosureBatchRequest:
      type: object
      description: 일괄 폐강 본문. 최대 개수는 정하지 않는다.
      additionalProperties: false
      required: [courseCodes]
      properties:
        courseCodes:
          type: array
          minItems: 1
          uniqueItems: true
          description: 폐강할 과목코드 목록(1개 이상, 중복 없음). 처리와 결과는 이 순서를 따른다.
          items:
            $ref: '#/components/schemas/CourseCode'
    CourseClosureItemResult:
      type: object
      description: 과목 1건의 폐강 결과.
      additionalProperties: false
      required: [courseCode, code, closedEnrollmentCount]
      properties:
        courseCode:
          $ref: '#/components/schemas/CourseCode'
        code:
          $ref: '#/components/schemas/CourseClosureItemCode'
        closedEnrollmentCount:
          type: [integer, 'null']
          minimum: 0
          description: OK일 때 CLOSED로 보존된 행 수. 그 밖에는 null이다.
      allOf:
        - if:
            properties:
              code:
                const: OK
          then:
            properties:
              closedEnrollmentCount:
                type: integer
          else:
            properties:
              closedEnrollmentCount:
                type: 'null'
    CourseClosureBatchResult:
      type: object
      description: 입력 순서의 과목별 폐강 결과.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CourseClosureItemResult'
    FieldViolation:
      type: object
      description: E09 입력 위반 1건. 입력 값(특히 비밀번호)을 메시지에 되풀이하지 않는다.
      additionalProperties: false
      required: [source, field, message]
      properties:
        source:
          type: string
          enum: [BODY, QUERY, PATH]
          description: 위반 위치.
        field:
          type: string
          description: BODY는 JSON Pointer(RFC 6901, 본문 전체는 빈 문자열), QUERY·PATH는 파라미터 이름.
        message:
          type: string
          minLength: 1
          description: 사람이 읽는 위반 설명.
    ProblemDetails:
      type: object
      description: |
        RFC 9457 Problem Details. `type`은 `urn:crs:problem:{code}`, `status`는 HTTP 상태와 같다. `reason`은 E02에만,
        `activeTicketId`는 E03에만 쓰며 `violations`는 E09에 필수다.
      additionalProperties: false
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          format: uri
          description: 문제 유형 URI(`urn:crs:problem:{code}`).
        title:
          type: string
          minLength: 1
          description: 코드별 고정 제목.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP 상태 코드.
        detail:
          type: string
          minLength: 1
          description: 이번 오류의 설명. 비밀·내부 정보를 담지 않는다.
        code:
          $ref: '#/components/schemas/ProblemCode'
        reason:
          $ref: '#/components/schemas/AuthFailureReason'
        activeTicketId:
          $ref: '#/components/schemas/TicketId'
        violations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FieldViolation'
      allOf:
        - if:
            properties:
              code:
                const: E02
          else:
            not:
              required: [reason]
        - if:
            properties:
              code:
                const: E03
          else:
            not:
              required: [activeTicketId]
        - if:
            properties:
              code:
                const: E09
          then:
            required: [violations]
            properties:
              status:
                const: 400
          else:
            not:
              required: [violations]
        - if:
            properties:
              code:
                const: E01
          then:
            properties:
              status:
                const: 401
        - if:
            properties:
              code:
                const: E02
          then:
            properties:
              status:
                enum: [401, 403]
        - if:
            properties:
              code:
                enum: [E03, E05, E06, E10, E11, E14, E15]
          then:
            properties:
              status:
                const: 409
        - if:
            properties:
              code:
                const: E04
          then:
            properties:
              status:
                const: 404
        - if:
            properties:
              code:
                const: E13
          then:
            properties:
              status:
                const: 422
        - if:
            properties:
              code:
                const: INTERNAL_ERROR
          then:
            properties:
              status:
                const: 500
        - if:
            required: [reason]
            properties:
              reason:
                enum: [ACCESS_TOKEN_EXPIRED, SESSION_REVOKED, SESSION_EXPIRED, REFRESH_TOKEN_INVALID, REFRESH_TOKEN_REUSED]
          then:
            properties:
              status:
                const: 401
        - if:
            required: [reason]
            properties:
              reason:
                enum: [LOGIN_PROOF_INVALID, LOGIN_PROOF_EXPIRED, LOGIN_EXCHANGE_CONSUMED, CSRF_CHECK_FAILED, FORBIDDEN]
          then:
            properties:
              status:
                const: 403
        - if:
            properties:
              code:
                const: E02
              status:
                const: 403
          then:
            required: [reason]
  examples:
    ProblemE01LoginRejected:
      summary: 거절로 종결된 LOGIN 티켓의 토큰 수령 시도
      value:
        type: 'urn:crs:problem:E01'
        title: 인증 실패
        status: 401
        detail: 로그인 요청이 거절로 종결되었습니다. 다시 로그인하십시오.
        code: E01
    ProblemE02AccessMissing:
      summary: Access 없음 또는 형식·서명 오류(reason 없음)
      value:
        type: 'urn:crs:problem:E02'
        title: 인증·권한 없음
        status: 401
        detail: 유효한 Access 토큰이 필요합니다.
        code: E02
    ProblemE02AccessExpired:
      summary: Access 만료
      value:
        type: 'urn:crs:problem:E02'
        title: 인증·권한 없음
        status: 401
        detail: Access 토큰이 만료되었습니다. 토큰을 갱신한 뒤 다시 요청하십시오.
        code: E02
        reason: ACCESS_TOKEN_EXPIRED
    ProblemE02SessionRevoked:
      summary: 세션 폐기(로그아웃·재사용 탐지)
      value:
        type: 'urn:crs:problem:E02'
        title: 인증·권한 없음
        status: 401
        detail: 세션이 종료되었습니다. 다시 로그인하십시오.
        code: E02
        reason: SESSION_REVOKED
    ProblemE02SessionExpired:
      summary: 세션 절대 만료(7일)
      value:
        type: 'urn:crs:problem:E02'
        title: 인증·권한 없음
        status: 401
        detail: 세션 유효 기간이 끝났습니다. 다시 로그인하십시오.
        code: E02
        reason: SESSION_EXPIRED
