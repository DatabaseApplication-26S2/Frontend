    | [AUT-01-02](단위업무기술서.md#aut-01-02) | 로그아웃 | `POST /auth/logout` |
    | [AUT-01-03](단위업무기술서.md#aut-01-03) | 로그인 토큰 수령 | `POST /auth/login-tickets/{ticketId}/tokens` |
    | [AUT-01-04](단위업무기술서.md#aut-01-04) | 토큰 갱신 | `POST /auth/refresh` |
    | [AUT-02-01](단위업무기술서.md#aut-02-01) | 수강신청 화면 진입 | `POST /admission` |
    | [AUT-03-01](단위업무기술서.md#aut-03-01) | 역할 기반 접근 제어 | 모든 연산의 공통 검사(별도 연산 없음) |
    | [QUE-01-01](단위업무기술서.md#que-01-01) | 대기 티켓 발급 | 대기열 4유형 접수(`login`, `requestAdmission`, `requestEnrollment`, `requestCancellation`)의 202 |
