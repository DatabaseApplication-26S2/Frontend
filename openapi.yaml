    | [CMG-01-01](단위업무기술서.md#cmg-01-01) | 담당 과목 조회 | `GET /professor/courses` |
    | [CMG-02-01](단위업무기술서.md#cmg-02-01) | 과목 등록 | `POST /professor/courses` |
    | [CMG-02-02](단위업무기술서.md#cmg-02-02) | 과목 정보 수정 | `PUT /professor/courses/{courseCode}` |
    | [CMG-02-03](단위업무기술서.md#cmg-02-03) | 담당 과목 폐강 | `POST /professor/courses/{courseCode}/closure` |
    | [ADM-01-01](단위업무기술서.md#adm-01-01) | 관리자 수강신청 | `POST /admin/enrollments` |
    | [ADM-02-01](단위업무기술서.md#adm-02-01) | 서비스 설정 관리 | `GET /admin/settings`, `PUT /admin/settings` |
    | [ADM-03-01](단위업무기술서.md#adm-03-01) | 폐강 대상 조회 | `GET /admin/closure-candidates` |
    | [ADM-03-02](단위업무기술서.md#adm-03-02) | 폐강 처리 | `POST /admin/course-closures` |

    ## 3. 공통 규약

    - 기준 경로는 `/api/v1`이다. 요청·응답 본문은 UTF-8 JSON(`application/json`), 오류는 `application/problem+json`이다.
    - 속성·연산 이름은 영어 camelCase, 열거값은 영어 대문자다.
    - 시각은 UTC RFC 3339 `date-time`(`Z` 표기)이다. null 허용은 OAS 3.1 타입 합집합(`type: [string, 'null']` 또는
      `oneOf`의 `type: 'null'`)으로 표기한다.
    - 사용자ID는 비어 있지 않은 문자열이다. 티켓 ID는 JavaScript 정수 정밀도 문제를 피하려고 양의 10진수 문자열로
      주고받는다. 과목코드는 `^[A-Za-z0-9]{1,10}$`이며 대소문자를 구분하고, 바꿀 수 없고, 폐강 과목을 포함한 전체
      과목에서 유일하며, 재사용하지 않는다. 서버 내부의 불변 과목 인스턴스ID는 잠금·관계 식별에 계속 쓰지만 API로
      노출하거나 입력받지 않는다. 수강신청 행의 별도 ID도 없다.
    - 식별자와 비밀번호는 trim·대소문자 변환·유니코드 정규화 없이 받은 그대로 다룬다.
    - 정의되지 않은 본문 필드·쿼리 파라미터, 서버 소유 필드(예: 수정 본문의 `courseCode`), 같은 쿼리 파라미터의
      반복, 본문을 받지 않는 요청의 본문, JSON이 아닌 본문은 모두 400 E09다. 서버가 대신 채우거나 무시하지 않는다.
    - 페이지 목록은 과목 검색과 폐강 대상 조회 두 가지뿐이다. `page`(1 이상, 기본 1), 크기 20 고정, 과목코드
      ASCII(바이트) 오름차순이며 `pageSize`·정렬 파라미터는 없다. 마지막 페이지 뒤를 요청하면 빈 `items`와 그 읽기
      시점의 정확한 메타데이터를 반환한다. 결과가 0건이면 `totalPages`는 0이다. 그 밖의 목록은 전체 항목을
      `{items}`로 반환한다.
    - 모든 응답(오류 포함)에 `Cache-Control: no-store`를 둔다. 모든 응답이 사용자별 데이터이거나 자격 증명을 다룬다.
    - 응답에는 비밀번호(원문·해시), 토큰 해시, 소유 증명 값, 처리기·리스·소유권 세대·슬롯 식별 정보, 다른 학생의
      기록을 넣지 않는다.

    ## 4. 인증 모델

    ### 4.1 배포 형태(예시)

    웹 `https://app.example.com`과 API `https://api.example.com`은 **같은 사이트(same-site)이면서 다른
    출처(cross-origin)**인 HTTPS 서브도메인이다. 예약된 예시 도메인이며 실제 배포 도메인은 아직 정하지 않았다.

    ### 4.2 자격 증명

    | 자격 증명 | 전달 | 수명 | 서버 보관 | 클라이언트 보관 |
    |---|---|---|---|---|
    | 계정 비밀번호 | 로그인 요청 본문(원문) | 접수 후 최대 5분(단기 메모리 컨텍스트) | 영구 보관은 ENT-01의 **비밀번호 해시**뿐이다. 입력 원문은 DB·티켓·이력·로그에 남기지 않고 검증 후 폐기한다. | 보관 금지 |
    | 익명 소유 증명 | `__Host-crs_login` 쿠키 | 600초(로그인 접수 시각 기준) | 검증용 다이제스트와 익명 컨텍스트 결합(ENT-04) | HttpOnly 쿠키 |
    | Access JWT | `Authorization: Bearer` | 최대 15분, 세션 만료를 넘지 않음 | 저장하지 않음(서명 검증 후 세션 조회) | JS 메모리만 |
    | Refresh | `__Host-crs_refresh` 쿠키(불투명 난수) | 세션 절대 만료(로그인 후 7일, 비연장)까지 | 토큰 해시만(ENT-07) | HttpOnly 쿠키 |

    ### 4.3 쿠키

    두 쿠키는 모두 `Secure; HttpOnly; SameSite=Lax; Path=/`이며 `Domain` 속성이 없다(API 호스트 전용).
    `__Host-` 접두사 때문에 형제 서브도메인이 같은 이름의 쿠키를 심을 수 없다. Refresh 쿠키의 `Max-Age`는 세션
    `expiresAt`까지 남은 초를 넘지 않는다.

    `Path=/` 때문에 두 쿠키는 모든 API 요청에 함께 전송되지만, 서버는 쿠키를 다음 연산에서만 자격 증명으로 쓰고 그 밖의
    연산에서는 무시한다. Bearer 연산을 쿠키로 인증하지 않는다.
    - `__Host-crs_refresh`: `refreshTokens`, `logout`
    - `__Host-crs_login`: `login`(미완료 LOGIN 중복 판정), `exchangeLoginTokens`, `getTicket`(LOGIN 티켓)

    ### 4.4 CORS와 CSRF

    - 쿠키를 쓰는 요청은 `fetch(url, { credentials: 'include' })`로 보낸다.
    - CORS 응답: `Access-Control-Allow-Origin`은 설정된 프런트엔드 출처와 정확히 같은 값(와일드카드 금지),
      `Access-Control-Allow-Credentials: true`, 허용 메서드 `GET, POST, PUT, DELETE`, 허용 헤더
      `Authorization, Content-Type, X-CSRF-Protection`, 노출 헤더 `Location, Retry-After`(`Set-Cookie`는 노출하지 않음),
      `Vary: Origin`. 사전 요청(`OPTIONS`)은 계약 연산이 아니다.
    - 쿠키를 다루는 변경 요청 4개(`login`, `exchangeLoginTokens`, `refreshTokens`, `logout`)는 `Origin`이 허용 출처와
      정확히 같고 `X-CSRF-Protection: 1` 헤더가 있어야 한다. 하나라도 어긋나면 어떤 상태도 바꾸지 않고 403 E02
      `CSRF_CHECK_FAILED`를 반환한다. 이 헤더는 인증 비밀이 아니라 단순 요청을 사전 요청으로 바꾸는 장치다. 같은
      사이트의 다른 서브도메인에서 온 요청에는 SameSite가 쿠키를 막지 않으므로 이 검사가 필수다. 본문이 있는
      요청은 `application/json`만 받는다.
    - Bearer만 쓰는 요청은 브라우저가 자격 증명을 자동 첨부하지 않으므로 CSRF 헤더를 요구하지 않는다. CSRF 토큰
      발급용 별도 연산은 없다.

    ### 4.5 Access JWT 검증

    - 필수 클레임: `sub`(사용자ID), `sid`(세션ID), `role`, `iss`, `aud`, `iat`, `exp`. `sid`는 비밀이 아니다.
    - 서버가 고정한 허용 서명 알고리즘과 키 출처로 서명을 검증하고, `iss`·`aud`·시간을 확인한 뒤, 서버의
      세션(ACTIVE이고 현재 시각 < `expiresAt`)·사용자·역할을 권위로 확인한다. 토큰 안 `role`보다 서버 값이 우선한다.
    - 클라이언트가 보낸 `sid`나 세대 값만으로 세션을 폐기하거나 재사용을 추정하지 않는다. 서명 알고리즘과
      프레임워크 선택은 공개 계약에 포함하지 않는다.

    ### 4.6 세션과 Refresh 수명주기(ENT-06 접속 세션, ENT-07 Refresh 토큰 기록)

    1. LOGIN 처리기가 비밀번호 해시 검증에 성공하면 세션(ACTIVE, `loginAt`=검증 성공 시각,
       `expiresAt`=`loginAt`+7일, 미입장)과 LOGIN 티켓 결과 OK를 한 트랜잭션으로 커밋한다. 이 시점의 Refresh 기록은 0건이다.
    2. 토큰 교환은 세션의 최초 토큰 발급 시각을 기록하고 첫 Refresh 기록을 만든다. 세션당 한 번뿐이다.
    3. 갱신할 때마다 기존 Refresh를 소비 처리하고 새 Refresh를 만든다(회전). 세션당 미소비 Refresh는 최대 1건이다.
       소비된 해시는 적어도 세션 절대 만료까지 보존한다.
    4. 재사용 판정은 **발급되었다가 이미 소비된 Refresh의 해시 일치**로만 한다. 그 Refresh의 세션만 폐기하고 다른
       세션은 건드리지 않는다. 알 수 없는 해시는 어떤 세션도 바꾸지 않는다. 유예 시간은 없다.
    5. 로그아웃과 재사용 탐지는 세션을 지우지 않고 REVOKED(폐기 시각, 사유 LOGOUT 또는 REFRESH_REUSE)로 남긴다.
       로그아웃은 제시된 Refresh 해시가 발급 기록과 일치하면 **소비 여부와 무관하게** 그 세션을 폐기한다. 일치하는 기록은
       그 세션의 소유 증명이기 때문이다. 해시 조회·회전·재사용 폐기·로그아웃은 같은 세션 단위로 직렬화하므로, 로그아웃이
       커밋되면 그보다 먼저 회전된 새 Refresh와 그 세션의 Access도 함께 무효가 된다. 만료는 `expiresAt`으로 판정하며
       상태를 바꾸는 배치 작업에 의존하지 않는다. 세션 상태(ACTIVE|REVOKED)는 서버 내부 값이며 응답 필드가 아니다.
    6. 같은 세션의 갱신은 입장 상태(`admittedAt`)를 유지한다. 새 로그인은 새 세션이므로 다시 입장해야 한다.

    ### 4.7 클라이언트 계약(클라이언트 코드가 아닌 문서상 약속)

    - Access는 JS 메모리에만 둔다. 토큰 값은 `localStorage`·`sessionStorage`·`BroadcastChannel`·로그에 넣지 않는다.
    - 새로고침 등으로 메모리의 Access가 없으면 `POST /auth/refresh`로 복구한다.
    - 갱신은 탭 안에서 단일 비행(single-flight)으로, 탭 사이에서는 토큰 값을 공유하지 않는 잠금(예: Web Locks API)으로
      직렬화한다. 각 탭은 자기 Access를 직접 받는다. 동시 갱신과 자동 네트워크 재시도는 하지 않는다. 이미 회전된
      Refresh를 다시 보내면 재사용으로 판정되어 그 세션이 폐기된다.
    - 401 응답에 `reason`이 없거나 `ACCESS_TOKEN_EXPIRED`이면 갱신을 한 번 하고 원래 요청을 한 번 다시 보낸다. 그 밖의
      사유는 6절의 사유 표를 따른다.
    - 로그아웃이나 사용자 전환 시 메모리 토큰과 사용자·세션 범위 캐시(과목 목록, 신청 목록, 티켓 상태 등)를 지운다.

    ## 5. 대기열 티켓 프로토콜

    - 대기열 대상은 LOGIN·ADMISSION·ENROLLMENT·CANCELLATION 4유형이다. 나머지 연산은 즉시 처리하며 대기열과 N 슬롯을
      쓰지 않는다.
    - 새 티켓을 만들면 항상 **202**와 접수증(`Location`, `Retry-After: 2`)을 반환한다. 202는 업무 성공이 아니다. 접수
      단계의 오류는 4xx이며 티켓을 만들지 않는다. 접수증 `status`는 접수 확정 시점의 스냅샷(RECEIVED|WAITING)이며 이후
      상태를 보장하지 않는다.
    - 미완료(RECEIVED·WAITING·PROCESSING) 제한: 인증 전에는 익명 컨텍스트당 LOGIN 1건, 인증 후에는 검증 사용자당(모든
      세션 합산) 1건이다. 위반은 409 E03이며 알 수 있으면 본인 소유 `activeTicketId`를 준다. 로그인 본문에 입력한
      사용자ID는 LOGIN 티켓의 소유권이나 유일성 기준이 아니다.
    - 서버 접수 순서(티켓 번호)로 전역 FIFO claim하고, 같은 과목의 학생 신청·취소는 배치·복구를 넘어 티켓 순으로
      판정한다. 전체 완료 순서와 클릭 시각 순서는 보장하지 않는다. N은 동시에 점유할 수 있는 작업 슬롯 수이며 로그인
      사용자 수·대기열 길이·정원이 아니다. 슬롯·리스·복구 세대는 API 필드가 아니다.
    - **실행 권한은 원래 세션에 고정된다.** 인증 후 3유형은 실행 직전에 티켓을 만든 원래 세션이 ACTIVE이고 만료 전인지,
      역할·본인 소유·입장(학생 수강신청 업무)이 유효한지 다시 확인한다. 아니면 E02(입장만 없으면 E15)로 종결한다. Access
      만료만으로는 접수된 작업을 거절하지 않는다. 새로 로그인한 세션이 원래 세션의 실행 권한을 대신하지 않는다.
      재인가·업무 커밋·로그아웃은 세션 기준으로 직렬화하며, 로그아웃이 이미 커밋된 작업을 소급 취소하지 않는다.
    - **조회 권한**: LOGIN 티켓은 원래 익명 컨텍스트의 소유 증명 쿠키로만, 나머지 유형은 같은 사용자의 유효한
      Access(티켓을 만든 세션이 아니어도 됨, 재로그인 포함)로 조회한다.
    - 종결 결과 `{code, completedAt}`와 티켓의 유형·대상 과목은 불변이다. 이후의 취소·폐강·관리자 배정이 과거 결과를
      고치지 않는다. 결과에는 현재 여석·신청 목록·자격 증명이 없으므로 클라이언트는 필요한 자원을 다시 조회한다.
    - `queuePosition`은 WAITING일 때 자기보다 앞선 WAITING 티켓 수 + 1인 참고값이다. 예상 소요 시간이나 완료 순서가
      아니다. 권장 폴링 간격은 2초다.
    - E99는 안전한 소유권 회수 후 재투입 한도를 소진한 티켓의 종결 결과에만 쓴다. 일반 서버 오류(500)가 아니다.

    | requestType | 성공 | 거절 결과 코드 |
    |---|---|---|
    | LOGIN | OK | E01(인증 불일치, 자격 증명 컨텍스트 소실·만료), E99 |
    | ADMISSION | OK | E02(원래 세션 무효·학생 아님), E99 |
    | ENROLLMENT | OK | E02, E15, E04, E05, E06, E07(여석 없음, 대기명단 아님), E99 |
    | CANCELLATION | OK | E02, E15, E04, E05, E08(본인 현재 신청 없음), E99 |

    실행 단계의 E04는 고정된 대상 과목을 찾지 못할 때의 방어용 판정이다. 과목은 삭제되지 않으므로 정상 흐름에서는
    나오지 않는다.

    ## 6. 오류 규약

    오류 본문은 RFC 9457 Problem Details다: `type`(`urn:crs:problem:{code}`), `title`, `status`(HTTP 상태와 같음),
    `detail`, `code`, 선택 `reason`(E02에만), 선택 `activeTicketId`(E03에만), `violations`(E09에 필수).

    | code | HTTP | 의미 |
    |---|---|---|
    | E01 | 401 | 토큰 교환 대상 LOGIN 티켓이 거절로 종결됨(재로그인) |
    | E02 | 401 / 403 | 인증 없음·무효·만료(401), 권한·소유권·소유 증명·CSRF 실패(403) |
    | E03 | 409 | 미완료 요청 있음, 또는 토큰 교환 시 LOGIN 티켓 미종결 |
    | E04 | 404 | 과목 없음 |
    | E05 | 409 | 폐강 과목 |
    | E06 | 409 | 이미 신청한 과목 |
    | E09 | 400 | 입력값 오류 |
    | E10 | 409 | 과목코드 중복(폐강 과목 포함) |
    | E11 | 409 | 변경한 정원이 현재 활성 인원보다 작음 |
    | E13 | 422 | 학생 계정 아님 |
    | E14 | 409 | 폐강 대상 아님(이미 폐강 포함) |
    | E15 | 409 | 수강신청 화면 미입장 |
    | INTERNAL_ERROR | 500 | 기술 오류. 업무 결과 코드가 아니다. |

    E07·E08·E99는 티켓 종결 결과로만 전달된다. 티켓 조회 200 응답이 거절 결과를 담는 것은 HTTP 오류가 아니다.

    | reason | HTTP | 뜻 | 클라이언트 조치 |
    |---|---|---|---|
    | (없음) | 401 | Access 없음, 형식·서명·발급자·대상 불일치 | 갱신 1회 후 재시도 |
    | `ACCESS_TOKEN_EXPIRED` | 401 | Access 만료(세션은 유효할 수 있음) | 갱신 1회 후 재시도 |
    | `SESSION_REVOKED` | 401 | 세션 폐기(로그아웃·재사용 탐지) | 재로그인 |
    | `SESSION_EXPIRED` | 401 | 세션 절대 만료(7일) | 재로그인 |
    | `REFRESH_TOKEN_INVALID` | 401 | Refresh 없음·알 수 없음 | 재로그인 |
    | `REFRESH_TOKEN_REUSED` | 401 | 소비된 Refresh 재사용, 해당 세션 폐기 | 재로그인 |
    | `LOGIN_PROOF_INVALID` | 403 | 소유 증명 없음·불일치 | 재로그인 |
    | `LOGIN_PROOF_EXPIRED` | 403 | 소유 증명 만료 | 재로그인 |
    | `LOGIN_EXCHANGE_CONSUMED` | 403 | 이미 최초 토큰을 받음 | Refresh 쿠키가 있으면 갱신, 없으면 재로그인 |
    | `CSRF_CHECK_FAILED` | 403 | Origin·`X-CSRF-Protection` 검사 실패 | 클라이언트 설정 수정 |
    | `FORBIDDEN` | 403 | 역할·소유권 불일치, 티켓 접근 불가 | 같은 요청 반복 금지 |

    오류 응답은 비밀번호·토큰·해시, 내부 슬롯·리스·소유권 세대, 다른 사용자의 정보, 남의 티켓 존재 여부를 드러내지
    않는다. E09 `violations[].message`에 입력 값(특히 비밀번호)을 되풀이하지 않는다.

    ## 7. 공통 판정 순서

    연산 설명에 별도 순서가 있으면 그것을 따른다.

    1. 쿠키 변경 요청의 Origin·`X-CSRF-Protection` 검사(403)
    2. Access 인증(401)
    3. 역할·소유권(403)
    4. 학생 수강신청 업무의 화면 입장(409 E15)
    5. 입력 형식·범위(400 E09)
    6. 업무 판정(404·409·422). 과목 단위 변경은 같은 과목 잠금 아래에서 다시 검증한다.
servers:
  - url: https://{apiHost}/api/v1
    description: 예시 배포 주소이며 실제 운영 주소가 아니다. 웹(app.example.com)과 API(api.example.com)는 같은 사이트·다른 출처다.
    variables:
      apiHost:
        default: api.example.com
        description: API 호스트 이름. 예약된 예시 도메인이며 실제 배포 도메인은 미정이다.
tags:
  - name: auth
    description: 로그인 접수·토큰 수령·토큰 갱신·로그아웃(AUT-01)
  - name: queue
    description: 수강신청 화면 진입과 대기 티켓 조회(AUT-02, QUE-01)
  - name: courses
    description: 과목 검색과 상세 조회(ENR-01)
  - name: enrollments
    description: 학생 본인의 수강 신청·취소와 현재 신청 과목 조회(ENR-02)
  - name: professor
    description: 교수 담당 과목 조회·등록·수정·폐강(CMG)
  - name: admin
    description: 관리자 수강 배정·서비스 설정·폐강 관리(ADM)
paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 로그인 요청 접수(대기열 LOGIN 티켓 발급)
      description: |
        공개 요청이다. 사용자ID·비밀번호를 받아 공통 대기열에 LOGIN 티켓을 만들고 202 접수증을 반환한다. 202는 인증
        성공이 아니다. 결과는 `GET /tickets/{ticketId}`로 확인하고, 성공하면 `POST /auth/login-tickets/{ticketId}/tokens`로
        토큰을 받는다. Access 토큰은 요구하지 않으며 보내도 무시한다.

        **비밀번호 취급**
        - 영구 보관하는 값은 미리 등록된 계정(ENT-01)의 비밀번호 해시뿐이다.
        - 요청으로 받은 비밀번호 원문은 접수 시각부터 최대 5분(`credentialExpiresAt`) 동안 서버 메모리의 단기 컨텍스트에만
          둔다. DB·티켓·이력·로그·오류 응답에 남기지 않는다.
        - 차례가 되면 처리기가 일반 비밀번호 검증기로 해시와 비교하고 원문을 바로 폐기한다. 검증 전에 컨텍스트가
          소실·만료되면 E01로 종결하며 자동으로 다시 실행하지 않는다(재로그인).
        - ID 불일치와 비밀번호 불일치는 구분하지 않고 모두 E01이다.

        **익명 소유 증명**
        - 접수할 때 추측 불가능한 소유 증명을 새로 만들어 `__Host-crs_login` 쿠키(600초)로만 전달한다. 서버는 검증용
          다이제스트와 익명 컨텍스트 결합만 보존한다.
        - 익명 컨텍스트(유효한 소유 증명 쿠키)당 미완료 LOGIN은 1건이다. 요청에 붙은 쿠키가 미완료 LOGIN 티켓을 가리키면
          409 E03이며 새 티켓과 쿠키를 만들지 않는다. 쿠키가 없거나 종결된 티켓을 가리키면 새 익명 컨텍스트와 새 쿠키를
          발급한다.

        **판정 순서**: Origin·CSRF 헤더(403) → 본문 형식(400 E09) → 컨텍스트의 미완료 LOGIN(409 E03) → 접수(202).

        처리기 성공 시 세션 생성과 LOGIN 결과 OK를 원자적으로 커밋한다. 성공이 커밋된 뒤에는 단기 컨텍스트가 사라져도 커밋된
        결과와 세션이 유지된다. 토큰은 티켓 결과나 조회 응답에 넣지 않는다. 로그인은 같은 사용자의 다른 세션에 영향을 주지
        않는다(중복 로그인 제어 없음).
      x-business-functions:
        - id: AUT-01-01
          source: '단위업무기술서.md#aut-01-01'
        - id: QUE-01-01
          source: '단위업무기술서.md#que-01-01'
      security: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfProtectionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              student:
                summary: 학생 로그인(가짜 예시 자격 증명)
                value:
                  userId: '20260001'
                  password: example-password
      responses:
        '202':
          description: 로그인 요청 접수. 인증 성공을 뜻하지 않는다.
          headers:
            Location:
              $ref: '#/components/headers/TicketLocation'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Set-Cookie:
              $ref: '#/components/headers/SetLoginProofCookie'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginTicketReceipt'
              examples:
                accepted:
                  summary: 접수 확정(대기 중)
                  value:
                    ticketId: '1001'
                    requestType: LOGIN
                    status: WAITING
                    submittedAt: '2026-11-10T00:00:00Z'
                    statusUrl: /api/v1/tickets/1001
                    credentialExpiresAt: '2026-11-10T00:05:00Z'
                    proofExpiresAt: '2026-11-10T00:10:00Z'
        '400':
          description: 입력값 오류(E09). 티켓을 만들지 않는다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                missingPassword:
                  $ref: '#/components/examples/ProblemE09MissingPassword'
                unknownField:
                  $ref: '#/components/examples/ProblemE09UnknownLoginField'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '409':
          description: 이 익명 컨텍스트에 미완료 LOGIN 티켓이 있음(E03). 새 티켓·쿠키를 만들지 않으며 기존 티켓을 계속 조회한다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                loginPending:
                  $ref: '#/components/examples/ProblemE03LoginPending'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login-tickets/{ticketId}/tokens:
    parameters:
      - $ref: '#/components/parameters/TicketIdPath'
    post:
      tags: [auth]
      operationId: exchangeLoginTokens
      summary: 성공한 LOGIN 티켓으로 최초 토큰 수령(1회)
      description: |
        원래 익명 컨텍스트의 소유 증명(`__Host-crs_login`)으로 성공한 LOGIN 티켓의 최초 토큰을 **한 번만** 받는다. Access
        토큰은 요구하지 않는다. 티켓 조회(`GET /tickets/{ticketId}`)는 토큰을 발급하지 않는다. 요청 본문은 없다.

        **판정 순서**
        1. Origin·CSRF 헤더(403 `CSRF_CHECK_FAILED`) → 본문 없음·`ticketId` 형식(400 E09).
        2. 소유 증명 쿠키가 이 번호의 LOGIN 티켓을 만든 익명 컨텍스트의 증명과 일치해야 한다. 쿠키 없음, 불일치, 티켓 없음,
           LOGIN이 아닌 티켓은 모두 같은 403 `LOGIN_PROOF_INVALID`다(존재 여부 비노출). 일치하지만 `proofExpiresAt`이
           지났으면 403 `LOGIN_PROOF_EXPIRED`다.
        3. 티켓이 미완료이면 409 E03(`activeTicketId`는 이 티켓)이다. 폴링 후 다시 시도한다.
        4. 티켓이 REJECTED(결과 E01 또는 E99)이면 401 E01이다. 다시 로그인하며, 정확한 결과 코드는 티켓 조회로 확인한다.
        5. 이미 최초 토큰을 받았으면 403 `LOGIN_EXCHANGE_CONSUMED`다. 재수령은 없다.
        6. 로그인으로 생긴 세션이 REVOKED이면 401 `SESSION_REVOKED`, 만료되었으면 401 `SESSION_EXPIRED`다.
        7. 세션의 최초 토큰 발급 시각 기록, 첫 Refresh 기록 생성, Access 발급을 원자적으로 확정하고 200과 Refresh 쿠키를
           반환한다.

        **응답 유실**
        - 응답 전체(쿠키 포함)를 잃으면 교환은 이미 소비되었으므로 다시 로그인한다.
        - Refresh 쿠키는 받았지만 본문(Access)을 잃었으면 `POST /auth/refresh`로 복구한다.
        - 교환의 성공·실패·유실과 무관하게 LOGIN 티켓의 종결 결과는 바뀌지 않는다.
        - 소유 증명 쿠키는 600초 만료까지 남을 수 있지만 소비 기록 때문에 다시 토큰을 받는 데 쓸 수 없다. 이 연산은
          소유 증명 쿠키를 지우지 않는다.
      x-business-functions:
        - id: AUT-01-03
          source: '단위업무기술서.md#aut-01-03'
      security:
        - loginProofCookie: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfProtectionHeader'
      responses:
        '200':
          description: 최초 토큰 발급. 본문에 Access, 쿠키에 Refresh를 담는다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                student:
                  summary: 학생 최초 토큰(아직 화면 미입장)
                  value:
                    accessToken: eyJ0eXAiOiJKV1QifQ.eyJzdWIiOiIyMDI2MDAwMSJ9.ZXhhbXBsZS1vbmx5
                    tokenType: Bearer
                    expiresIn: 900
                    user:
                      userId: '20260001'
                      name: 김하늘
                      role: STUDENT
                    session:
                      expiresAt: '2026-11-17T00:00:04Z'
                      admittedAt: null
                professor:
                  summary: 교수 최초 토큰(입장 개념 없음)
                  value:
                    accessToken: eyJ0eXAiOiJKV1QifQ.eyJzdWIiOiJQMTAwMSJ9.ZXhhbXBsZS1vbmx5
                    tokenType: Bearer
                    expiresIn: 900
                    user:
                      userId: P1001
                      name: 김민수
                      role: PROFESSOR
                    session:
                      expiresAt: '2026-11-17T00:00:30Z'
                      admittedAt: null
        '400':
          description: 입력값 오류(E09). 상태를 바꾸지 않는다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalidTicketId:
                  $ref: '#/components/examples/ProblemE09InvalidTicketId'
                bodyNotAllowed:
                  $ref: '#/components/examples/ProblemE09BodyNotAllowed'
        '401':
          description: LOGIN 티켓이 거절로 종결됨(E01), 또는 연결된 세션이 폐기·만료됨(E02). 토큰을 발급하지 않는다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                loginRejected:
                  $ref: '#/components/examples/ProblemE01LoginRejected'
                sessionRevoked:
                  $ref: '#/components/examples/ProblemE02SessionRevoked'
                sessionExpired:
                  $ref: '#/components/examples/ProblemE02SessionExpired'
        '403':
          description: CSRF 검사 실패, 소유 증명 없음·불일치·만료, 또는 이미 소비된 교환(E02). 상태를 바꾸지 않는다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                csrfFailed:
                  $ref: '#/components/examples/ProblemE02CsrfFailed'
                proofInvalid:
                  $ref: '#/components/examples/ProblemE02LoginProofInvalid'
                proofExpired:
                  $ref: '#/components/examples/ProblemE02LoginProofExpired'
                exchangeConsumed:
                  $ref: '#/components/examples/ProblemE02LoginExchangeConsumed'
        '409':
          description: LOGIN 티켓이 아직 종결되지 않음(E03). 티켓을 폴링한 뒤 다시 시도한다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                loginIncomplete:
                  $ref: '#/components/examples/ProblemE03LoginTicketIncomplete'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Refresh 쿠키로 Access 재발급과 Refresh 회전
      description: |
        Refresh 쿠키로 새 Access를 받고 Refresh를 회전한다. Access는 요구하지 않으므로 만료된 Access 상태에서도 쓸 수 있다.
        대기열·N 슬롯·미완료 티켓 제한을 거치지 않지만 검증·회전·폐기는 원자적으로 처리한다. 요청 본문은 없다.

        **판정 순서**
        1. Origin·CSRF 헤더(403, 상태 변경 없음) → 본문 없음(400 E09).
        2. 쿠키가 없거나 그 해시가 어떤 발급 기록과도 일치하지 않으면 401 `REFRESH_TOKEN_INVALID`다. **어떤 세션도 바꾸지
           않는다.**
        3. 일치한 기록의 세션이 REVOKED이면 401 `SESSION_REVOKED`, 현재 시각이 `expiresAt` 이후이면 401
           `SESSION_EXPIRED`다(상태 변경 없음).
        4. 일치한 기록이 이미 소비되었으면 재사용이다. 그 기록의 세션만 REVOKED(사유 REFRESH_REUSE)로 바꾸고 401
           `REFRESH_TOKEN_REUSED`를 반환한다. 다른 세션은 그대로다.
        5. 미소비 기록이면 소비 표시와 새 Refresh 생성을 원자적으로 확정하고 200과 새 쿠키를 반환한다.

        같은 Refresh로 동시에 들어온 요청은 하나만 회전에 성공하고 나머지는 소비된 Refresh 제출이 되어 4번에 따라 세션이
        폐기된다. 유예 시간은 없으므로 클라이언트는 4.7절의 단일 비행·탭 간 직렬화를 지켜야 하며 갱신 요청을 자동으로
        재전송하지 않는다. 해시 조회·회전·재사용 폐기와 로그아웃은 같은 세션 단위로 직렬화한다. 로그아웃이 먼저 커밋되면 이
        요청은 3번에 따라 401 `SESSION_REVOKED`이고, 이 회전이 먼저 커밋되면 이후 로그아웃이 소비된 쿠키로도 그 세션을 폐기해
        여기서 발급한 새 Refresh·Access를 무효로 만든다. 401 응답은 Refresh 쿠키를 삭제한다. 응답의 `session.admittedAt`은
        같은 세션의 입장 상태를 그대로 보여 준다.
      x-business-functions:
        - id: AUT-01-04
          source: '단위업무기술서.md#aut-01-04'
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfProtectionHeader'
      responses:
        '200':
          description: 새 Access와 회전된 Refresh 쿠키.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                admittedStudent:
                  summary: 입장한 학생 세션의 갱신(입장 상태 유지)
                  value:
                    accessToken: eyJ0eXAiOiJKV1QifQ.eyJzdWIiOiIyMDI2MDAwMSJ9.cmVmcmVzaGVkLWV4YW1wbGU
                    tokenType: Bearer
                    expiresIn: 900
                    user:
                      userId: '20260001'
                      name: 김하늘
                      role: STUDENT
                    session:
                      expiresAt: '2026-11-17T00:00:04Z'
                      admittedAt: '2026-11-10T00:00:15Z'
        '400':
          description: 본문이 있음(E09). 상태를 바꾸지 않는다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                bodyNotAllowed:
                  $ref: '#/components/examples/ProblemE09BodyNotAllowed'
        '401':
          description: Refresh 무효·재사용 또는 세션 폐기·만료(E02). Refresh 쿠키를 삭제한다. 재로그인한다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                refreshInvalid:
                  $ref: '#/components/examples/ProblemE02RefreshInvalid'
                refreshReused:
                  $ref: '#/components/examples/ProblemE02RefreshReused'
                sessionRevoked:
                  $ref: '#/components/examples/ProblemE02SessionRevoked'
                sessionExpired:
                  $ref: '#/components/examples/ProblemE02SessionExpired'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 로그아웃(현재 세션 폐기, 반복 가능)
      description: |
        대기열을 거치지 않는 직접 요청이며 같은 요청을 반복해도 204다. 요청 본문이나 쿼리로 세션ID를 받지 않는다. 자격
        증명이 증명하는 자기 세션만 폐기하며 **어떤 경우에도 다른 세션을 바꾸지 않는다.**

        **판정 순서**
        1. Origin·CSRF 헤더(403, 상태 변경 없음) → 본문 없음(400 E09).
        2. Refresh 쿠키가 있으면 쿠키 방식이다. 쿠키 해시가 발급된 Refresh 기록과 일치하면 **소비 여부와 무관하게** 그
           기록의 세션이 증명된 것이다.
           - 그 세션이 ACTIVE이고 만료 전이면 그 세션만 REVOKED(사유 LOGOUT, 폐기 시각)로 바꾼다. 소비된 해시여도 재사용
             폐기(REFRESH_REUSE)나 401로 바꾸지 않고 정상 로그아웃으로 처리한다.
           - 이미 폐기·만료된 세션이면 상태를 바꾸지 않고 같은 204다.
           - 어떤 발급 기록과도 일치하지 않는 해시는 **어떤 세션도 바꾸지 않는다.**
           - 쿠키 방식에서는 `Authorization` 헤더를 보지 않는다.
        3. Refresh 쿠키가 없고 유효한 Access가 있으면 Access의 세션을 폐기한다. Access가 없거나 무효·만료이면 서버 상태를
           바꾸지 않는다.
        4. 어떤 경우에도 204와 함께 Refresh 쿠키와 로그인 소유 증명 쿠키를 삭제한다.

        **직렬화**: 해시 조회·회전(`refreshTokens`)·재사용 폐기·로그아웃은 같은 세션 단위로 직렬화한다. 다른 탭의 갱신이
        로그아웃 요청보다 먼저 커밋되어 쿠키가 소비 상태가 되었어도 로그아웃은 그 세션을 폐기하므로, 그 갱신으로 회전된 새
        Refresh와 새 Access도 함께 무효가 된다. 로그아웃이 먼저 커밋되면 이후 갱신은 401 `SESSION_REVOKED`다. 204를 받은 뒤
        같은 세션의 자격 증명이 살아남는 경우는 없다.

        - 세션은 지우지 않고 REVOKED로 남긴다. 전 기기 로그아웃은 없다.
        - 이 세션이 만든 미시작 작업은 실행 시 E02로 거절된다. 이미 커밋된 변경과 결과는 그대로다.
        - 로그인 소유 증명 쿠키 삭제는 브라우저 상태 정리일 뿐 진행 중인 LOGIN 티켓을 취소하지 않는다(티켓 취소 기능 없음).
          그 티켓이 성공해도 토큰을 받을 수 없으므로 생긴 세션은 쓰이지 않은 채 만료된다.
        - 클라이언트는 응답과 무관하게 메모리 토큰과 사용자·세션 범위 캐시를 지운다.
      x-business-functions:
        - id: AUT-01-02
          source: '단위업무기술서.md#aut-01-02'
      security:
        - refreshCookie: []
        - accessBearer: []
        - {}
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfProtectionHeader'
      responses:
        '204':
          description: |
            로그아웃 처리 완료. 인식된 자격 증명(소비 여부와 무관하게 발급 기록과 일치한 Refresh, 또는 유효한 Access)의 세션을
            폐기했거나 그 세션이 이미 폐기·만료된 상태다. 인식된 자격 증명이 없으면 서버 상태 변경 없이 쿠키만 삭제한다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearAuthCookies'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '400':
          description: 본문이 있음(E09). 상태를 바꾸지 않는다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                bodyNotAllowed:
                  $ref: '#/components/examples/ProblemE09BodyNotAllowed'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /admission:
    post:
      tags: [queue]
      operationId: requestAdmission
      summary: 수강신청 화면 진입 요청(대기열 ADMISSION 티켓 발급)
      description: |
        학생 세션의 수강신청 화면 입장을 대기열 순서대로 허가한다. 입장은 **세션 단위**다. 같은 세션의 토큰 갱신은 입장을
        유지하고, 새 로그인 세션은 다시 입장해야 한다. 교수·관리자는 입장 개념이 없다. 요청 본문은 없다.

        **판정 순서**: Access(401) → STUDENT 역할(403) → 본문 없음(400 E09) → 현재 세션이 이미 입장했으면 200(새 티켓 없음,
        사용자에게 미완료 티켓이 있어도 200) → 사용자 미완료 티켓 확인과 티켓 생성을 원자적으로(409 E03) → 202.

        **실행 단계**: 원래 세션이 ACTIVE·만료 전이고 학생인지 다시 확인하며, 아니면 E02로 종결한다. 성공하면 원래 세션의
        입장 시각과 티켓 결과 OK를 함께 커밋한다. 다른 세션에는 입장을 기록하지 않는다.
      x-business-functions:
        - id: AUT-02-01
          source: '단위업무기술서.md#aut-02-01'
        - id: QUE-01-01
          source: '단위업무기술서.md#que-01-01'
      security:
        - accessBearer: []
      responses:
        '200':
          description: 현재 세션이 이미 입장함. 새 티켓을 만들지 않는다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionState'
              examples:
                alreadyAdmitted:
                  summary: 이미 입장한 세션
                  value:
                    admittedAt: '2026-11-10T00:00:15Z'
        '202':
          description: 입장 요청 접수. 입장 성공을 뜻하지 않는다.
          headers:
            Location:
              $ref: '#/components/headers/TicketLocation'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TicketReceipt'
                  - properties:
                      requestType:
                        const: ADMISSION
              examples:
                accepted:
                  summary: 입장 요청 접수
                  value:
                    ticketId: '1042'
                    requestType: ADMISSION
                    status: WAITING
                    submittedAt: '2026-11-10T00:00:10Z'
                    statusUrl: /api/v1/tickets/1042
        '400':
          description: 본문이 있음(E09). 티켓을 만들지 않는다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                bodyNotAllowed:
                  $ref: '#/components/examples/ProblemE09BodyNotAllowed'
