    post:
      tags: [admin]
      operationId: closeCourses
      summary: 과목 일괄 폐강(과목별 트랜잭션, 과목별 결과)
      description: |
        요청 순서대로 과목마다 **별도 트랜잭션**으로 처리하고 HTTP 200과 입력 순서의 과목별 결과를 반환한다. 전체가
        실패해도 200이며, 앞서 성공한 과목은 되돌리지 않는다(전체 롤백 없음). 일괄 최대 개수는 정하지 않는다.

        **요청 단계 판정 순서**(실패하면 어떤 과목도 처리하지 않음): Access(401) → ADMIN(403) → 본문(400 E09: 빈 배열, 중복
        과목코드, 형식 오류, 정의되지 않은 필드).

        **과목별 판정**: 관리자 권한 재확인 → 같은 과목 잠금 → 과목 없음(E04) → "OPEN이고 현재 인원 < 최소 수강인원"이
        아님(E14, 이미 폐강 포함) → 폐강 → OK. 처리 도중 관리자 세션이 무효가 되면 그 과목부터 남은 항목은 변경 없이 E02다.

        **효과**는 교수의 담당 과목 폐강과 같다: 과목 CLOSED, 해당 ENROLLED 행 CLOSED로 보존, 현재 인원 0. 대기 중인 신청·취소는
        실행 시 E05이고 이미 확정된 티켓 결과는 바뀌지 않는다. 자동 폐강, 강제 폐강, 폐강 되돌리기는 없다.
      x-business-functions:
        - id: ADM-03-02
          source: '단위업무기술서.md#adm-03-02'
      security:
        - accessBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseClosureBatchRequest'
            examples:
              batch:
                summary: 3개 과목 일괄 폐강
                value:
                  courseCodes: [HIS1002, CSE4020, NOP0000]
      responses:
        '200':
          description: 입력 순서의 과목별 결과. 일부 또는 전부 실패해도 200이다.
