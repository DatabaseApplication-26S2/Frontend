    get:
      tags: [queue]
      operationId: getTicket
      summary: 본인 대기 티켓의 상태·순번·종결 결과 조회
      description: |
        티켓 유형에 따라 **조회 자격이 다르다**(조건부 소유).
        - LOGIN: 원래 익명 컨텍스트의 소유 증명 쿠키(`__Host-crs_login`)가 이 티켓과 일치하고 만료 전이어야 한다. 다른
          세션의 유효한 Access가 있어도 대신하지 않는다.
        - ADMISSION·ENROLLMENT·CANCELLATION: 유효한 Access의 사용자가 티켓의 검증 요청자와 같아야 한다. 티켓을 만든
          세션이 아니어도 같은 사용자의 유효한 세션(재로그인 포함)이면 된다.

        **판정 순서(존재 여부 비노출)**
        1. `ticketId` 형식(400 E09).
        2. `Authorization` 헤더가 **있으면** 티켓을 찾기 전에 먼저 검증하고, 무효·만료이거나 세션이 폐기·만료되었으면 401
           E02다. 헤더가 없으면 이 단계를 건너뛴다.
        3. 위 조회 자격을 만족하지 않으면 원인(티켓 없음, 다른 사용자 티켓, 소유 증명 없음·불일치·만료, 유형에 맞지 않는
           자격 증명)과 관계없이 동일한 403 E02 `FORBIDDEN`이다.
        4. 200. 미완료 티켓이면 `Retry-After`로 다음 조회 간격을 안내한다.

        조회는 토큰을 발급하지 않는다. 성공한 LOGIN 티켓의 응답에도 토큰·세션 정보가 없으며 토큰은
        `POST /auth/login-tickets/{ticketId}/tokens`로만 받는다. 폴링 중 Access가 만료되면 갱신 후 다시 조회한다. Access
        만료는 접수된 작업을 무효로 만들지 않는다. 종결 결과(SUCCEEDED·REJECTED)는 HTTP 오류가 아니라 200 본문으로 전달한다.
