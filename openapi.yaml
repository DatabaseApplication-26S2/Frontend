                  summary: 성공·이미 폐강(교수가 먼저 폐강)·과목 없음
                  value:
                    items:
                      - courseCode: HIS1002
                        code: OK
                        closedEnrollmentCount: 3
                      - courseCode: CSE4020
                        code: E14
                        closedEnrollmentCount: null
                      - courseCode: NOP0000
                        code: E04
                        closedEnrollmentCount: null
                authorizationLost:
                  summary: 처리 도중 관리자 세션이 폐기됨(앞선 성공 유지)
                  value:
                    items:
                      - courseCode: HIS1002
                        code: OK
                        closedEnrollmentCount: 3
                      - courseCode: CSE4020
                        code: E02
                        closedEnrollmentCount: null
                      - courseCode: NOP0000
                        code: E02
                        closedEnrollmentCount: null
        '400':
          description: 본문 오류(E09). 어떤 과목도 처리하지 않는다.
