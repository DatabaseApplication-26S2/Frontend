  /admin/enrollments:
    post:
      tags: [admin]
      operationId: createAdminEnrollment
      summary: 관리자 수강 배정(정원 검사만 생략)
      description: |
        관리자가 학번을 정확히 입력해 학생을 과목에 직접 배정한다. 학생 검색 연산은 없다. 공통 대기열·N 슬롯·학생의 미완료
        티켓 제한을 거치지 않으며 대기 중인 학생 요청과의 전역 순서·공정성은 보장하지 않는다. 같은 과목 잠금은 쓴다. 정원
        검사만 생략하므로 현재 인원이 정원을 넘을 수 있다.

        **판정 순서**: Access(401) → ADMIN(403) → 본문(400 E09) → 같은 과목 잠금과 `studentId` 확인(없거나 학생이 아니면 422
        E13) → 과목 없음(404 E04) → 폐강(409 E05) → 이미 신청(409 E06) → ENROLLED 행(`enrollmentType` ADMIN, 배정 관리자
        기록) 생성과 현재 인원 +1을 원자적으로 커밋 → 201.

        배정 이후 그 학생의 같은 과목 대기 신청은 실행 시 E06이 된다. 배정 행은 학생이 취소할 수 있다.
